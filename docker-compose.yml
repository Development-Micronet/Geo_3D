version: "3.9"

services:
  backend:
    build: ./geo3d_backend
    ports:
      - "8000:8000"
    environment:
      SLPK_CORS_ORIGINS: "*"
      SLPK_PUBLIC_BASE_URL: "http://localhost:8000"
    volumes:
      - slpk_data:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  slpk_data:
